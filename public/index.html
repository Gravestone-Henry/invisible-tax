<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry's Finance | Monte Carlo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000;
            --green-mofado: #507a34; 
            --pink: #ff007f; 
            --text: #c5c5c5;
            --panel: #0a0a0a;
            --grid: rgba(131, 149, 119, 0.05);
        }

        body {
            background-color: var(--bg);
            
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .nihilist-bg {
            position: fixed;
            font-size: 0.7rem;
            color: rgba(131, 149, 119, 0.1);
            pointer-events: none;
            z-index: -1;
            transition: color 0.5s;
        }

        
        body:hover .nihilist-bg {
            color: rgba(255, 0, 127, 0.05);
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: var(--panel);
            padding: 25px;
            border: 1px solid var(--green-mofado);
            box-shadow: 0 0 20px rgba(0,0,0,1);
            position: relative;
            z-index: 1;
        }

        h1 {
            color: var(--bg);
            background: var(--pink);
            display: inline-block;
            padding: 5px 15px;
            font-size: 1.1rem;
            margin-top: 0;
            box-shadow: 4px 4px 0 var(--green-mofado);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        input {
            background: #000;
            border: 1px solid var(--green-mofado);
            color: var(--pink);
            padding: 8px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--pink);
        }

        button {
            background: transparent;
            border: 2px solid var(--pink);
            color: var(--pink);
            padding: 15px 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        
        button:hover {
            background: var(--pink);
            color: #000;
            box-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink);
            text-shadow: none;
        }

        canvas {
            margin-top: 30px;
            border: 1px solid rgba(131, 149, 119, 0.2);
            background: rgba(0,0,0,0.8);
        }

        label { 
            font-size: 0.65rem; 
            color: var(--green-mofado);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-group { display: flex; flex-direction: column; }

    </style>
</head>
<body>

    
    <div class="nihilist-bg" style="top: 10%; left: 5%;">O DINHEIRO É UMA ALUCINAÇÃO COLETIVA</div>
    <div class="nihilist-bg" style="top: 40%; right: 10%;">A INFLAÇÃO NÃO DORME</div>
    <div class="nihilist-bg" style="bottom: 15%; left: 15%;">TODO GRÁFICO TERMINA EM ZERO</div>
    <div class="nihilist-bg" style="top: 70%; left: 2%;">POUPAR É ADIAR O INEVITÁVEL</div>
    <div class="nihilist-bg" style="bottom: 5%; right: 5%;">NÚMEROS NÃO TÊM ALMA</div>

    <div class="container">
        <h1>PROJETO_VAZIO_FINANCEIRO_</h1>
        <p style="color: var(--green-mofado); font-size: 0.8rem;">// Calcule a velocidade da sua obsolescência econômica.</p>

        <div class="controls">
            <div class="input-group">
                <label>Capital Inicial</label>
                <input type="number" id="initial" value="1000">
            </div>
            <div class="input-group">
                <label>Mensalidade</label>
                <input type="number" id="monthly" value="200">
            </div>
            <div class="input-group">
                <label>Taxa Anual (%)</label>
                <input type="number" id="yield" value="12">
            </div>
            <div class="input-group">
                <label>Volatilidade (%)</label>
                <input type="number" id="vol" value="15">
            </div>
        </div>

        <button id="runBtn">SIMULAR O ABISMO</button>

        <canvas id="mainChart"></canvas>
    </div>

<script>
    // Lógica Matemática (Monte Carlo)
    function generateGaussian(mean, std) {
        let u = 0, v = 0;
        while(u === 0) u = Math.random();
        while(v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * std + mean;
    }

    function simulate(initial, monthly, months, annualYield, annualVol) {
        let balance = initial;
        const history = [initial];
        const mYield = Math.pow(1 + (annualYield/100), 1/12) - 1;
        const mVol = (annualVol/100) / Math.sqrt(12);

        for (let i = 0; i < months; i++) {
            const change = generateGaussian(mYield, mVol);
            balance = (balance + monthly) * (1 + change);
            history.push(balance);
        }
        return history;
    }

    let myChart = null;

    document.getElementById('runBtn').addEventListener('click', () => {
        const initial = parseFloat(document.getElementById('initial').value);
        const monthly = parseFloat(document.getElementById('monthly').value);
        const yieldRate = parseFloat(document.getElementById('yield').value);
        const vol = parseFloat(document.getElementById('vol').value);
        const months = 60; 

        const allSimulations = [];
        for (let i = 0; i < 45; i++) {
            allSimulations.push(simulate(initial, monthly, months, yieldRate, vol));
        }

        const inflationRate = 0.06; // 6% de inflação niilista
        const mInf = Math.pow(1 + inflationRate, 1/12) - 1;
        let infBalance = initial;
        const inflationPath = [initial];
        for(let i=0; i<months; i++) {
            infBalance = (infBalance + monthly) * (1 - mInf);
            inflationPath.push(infBalance);
        }

        const ctx = document.getElementById('mainChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({ length: months + 1 }, (_, i) => i),
                datasets: [
                    ...allSimulations.map(data => ({
                        data: data,
                        borderColor: '#83957722',
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: false,
                    })),
                    {
                        label: 'INFLAÇÃO',
                        data: inflationPath,
                        borderColor: '#ff007f',
                        borderWidth: 3,
                        pointRadius: 0,
                        fill: false,
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#1a1a1a' }, ticks: { color: '#839577' } },
                    y: { grid: { color: '#1a1a1a' }, ticks: { color: '#839577' } }
                }
            }
        });
    });
</script>
</body>
</html>
